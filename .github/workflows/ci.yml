name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

# A rapid sequence of main-branch updates should validate the newest tree, not
# leave every obsolete revision occupying the hosted-runner queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs separately from tests so style and structural failures remain
  # visible even when native compilation or integration setup fails later.
  lint:
    name: Go lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go linters
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinning prevents a hosted image update from silently changing the
          # repository's accepted style or formatter behavior.
          version: v2.12.2
          args: >-
            ./cmd/...
            ./internal/app/clientapp
            ./internal/app/clientsession
            ./internal/app/envconfig
            ./internal/app/filewatch
            ./internal/app/gameserver/...
            ./internal/app/headlessshell
            ./internal/app/host

  # Tests retain their own checkout and toolchain so neither job depends on
  # mutable artifacts produced by the other.
  test:
    name: Go test and race
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile native client backends
        run: make build-client-backends
      - name: Unit and integration tests
        run: make test
      - name: Install Lua quality tools
        run: |
          brew install lua@5.4 stylua
          echo "$(brew --prefix lua@5.4)/bin" >> "$GITHUB_PATH"
      - name: D2legacy Lua harness hardening
        run: make test-lua-hardening
      - name: Architecture boundaries
        run: make architecture
      - name: Race tests
        run: make test-race
