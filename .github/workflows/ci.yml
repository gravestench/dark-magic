name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A rapid sequence of main-branch updates should validate the newest tree, not
# leave every obsolete revision occupying the hosted-runner queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test and race
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and integration tests
        run: make test
      - name: Install Lua quality tools
        run: |
          brew install lua@5.4 stylua
          echo "$(brew --prefix lua@5.4)/bin" >> "$GITHUB_PATH"
      - name: D2legacy Lua harness hardening
        run: make test-lua-hardening
      - name: Architecture boundaries
        run: make architecture
      - name: Race tests
        run: make test-race
